# Site settings
title: "AI Game Tools Daily"
description: "Curated AI tools and news for game development - Updated April 6, 2026"
baseurl: "/ai-game-tools-daily"
url: "https://sionsychen.github.io"

# Timezone
timezone: Asia/Shanghai

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Default values
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - _data/
