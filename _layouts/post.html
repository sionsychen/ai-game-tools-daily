---
layout: default
---

<article class="post-page">
  <div class="container">
    <header class="post-header">
      <h1 class="post-title" data-title-en="{{ page.title }}" data-title-zh="{{ page.title_zh | default: page.title }}">{{ page.title }}</h1>
      <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
    </header>

    <!-- Articles from frontmatter -->
    {% if page.articles %}
    <div class="articles-list">
      {% for article in page.articles %}
      <article class="article-item" data-category="{{ article.category }}">
        <div class="article-header">
          <span class="category-badge category-{{ article.category }}" data-cat-en="{{ article.category | capitalize }}" data-cat-zh="{{ article.category | capitalize }}">
            {{ article.category | capitalize }}
          </span>
          <h2 class="article-title" data-title-en="{{ article.title }}" data-title-zh="{{ article.title_zh | default: article.title }}">{{ article.title }}</h2>
        </div>
        <div class="article-content">
          <p class="article-summary" data-summary-en="{{ article.summary }}" data-summary-zh="{{ article.summary_zh | default: article.summary }}">{{ article.summary }}</p>
          <a href="{{ article.sourceUrl }}" target="_blank" class="read-more" data-i18n="article.readMore">Read article →</a>
        </div>
      </article>
      {% endfor %}
    </div>
    {% else %}
    <!-- Fallback: render markdown content -->
    <div class="article-content">
      {{ content }}
    </div>
    {% endif %}

    <footer class="post-footer">
      <a href="{{ '/' | relative_url }}" class="back-link" data-i18n="common.backHome">← Back to Home</a>
    </footer>
  </div>
</article>

<script>
// Language Switcher for Post Page (ai-game-tools-daily)
(function() {
  const i18nStrings = {
    en: { 'article.readMore': 'Read article →', 'common.backHome': '← Back to Home' },
    zh: { 'article.readMore': '阅读全文 →', 'common.backHome': '← 返回首页' }
  };

  const catNames = {
    en: { 'ai-tools': 'AI Tools', 'ai-code': 'AI Code', 'ai-art': 'AI Art', 'ai-audio': 'AI Audio', 'ai-animation': 'AI Animation', 'ai-video': 'AI Video' },
    zh: { 'ai-tools': 'AI 工具', 'ai-code': 'AI 编程', 'ai-art': 'AI 美术', 'ai-audio': 'AI 音频', 'ai-animation': 'AI 动画', 'ai-video': 'AI 视频' }
  };

  function updatePostLanguage(lang) {
    // Update i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (i18nStrings[lang] && i18nStrings[lang][key]) {
        el.textContent = i18nStrings[lang][key];
      }
    });

    // Update page title
    const titleEl = document.querySelector('.post-title');
    if (titleEl && titleEl.dataset.titleZh) {
      titleEl.textContent = lang === 'zh' ? titleEl.dataset.titleZh : titleEl.dataset.titleEn;
    }

    // Update article titles
    document.querySelectorAll('.article-title').forEach(el => {
      const title = lang === 'zh' ? el.dataset.titleZh : el.dataset.titleEn;
      if (title) el.textContent = title;
    });

    // Update article summaries
    document.querySelectorAll('.article-summary').forEach(el => {
      const summary = lang === 'zh' ? el.dataset.summaryZh : el.dataset.summaryEn;
      if (summary) el.textContent = summary;
    });

    // Update category badges
    document.querySelectorAll('.category-badge').forEach(el => {
      const cat = el.className.match(/category-([\w-]+)/)?.[1];
      if (cat && catNames[lang] && catNames[lang][cat]) {
        el.textContent = catNames[lang][cat];
      }
    });
  }

  window.onLanguageChange = updatePostLanguage;

  // Initialize on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('site-language') || 'en';
      updatePostLanguage(savedLang);
    });
  } else {
    const savedLang = localStorage.getItem('site-language') || 'en';
    updatePostLanguage(savedLang);
  }
})();
</script>

<style>
.post-page {
  padding: 3rem 0;
}

.post-header {
  margin-bottom: 2rem;
}

.post-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--slate-100);
  margin-bottom: 0.5rem;
}

.post-date {
  color: var(--slate-400);
  font-size: 0.875rem;
}

.post-footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--slate-800);
}

.back-link {
  color: var(--emerald-400);
  font-weight: 500;
  transition: color 0.2s;
}

.back-link:hover {
  color: var(--emerald-300);
}

.articles-list {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.article-item {
  background: var(--slate-800);
  border-radius: 0.75rem;
  padding: 1.5rem;
  border: 1px solid var(--slate-700);
  transition: border-color 0.2s, transform 0.2s;
}

.article-item:hover {
  border-color: var(--emerald-500);
  transform: translateY(-2px);
}

.article-header {
  margin-bottom: 1rem;
}

.category-badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  background: var(--emerald-600);
  color: white;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.article-title {
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--slate-100);
  line-height: 1.4;
}

.article-content {
  color: var(--slate-400);
  line-height: 1.6;
}

.article-summary {
  margin-bottom: 1rem;
}

.read-more {
  display: inline-flex;
  align-items: center;
  color: var(--emerald-400);
  font-weight: 500;
  text-decoration: none;
  font-size: 0.875rem;
  transition: color 0.2s;
}

.read-more:hover {
  color: var(--emerald-300);
}
</style>
