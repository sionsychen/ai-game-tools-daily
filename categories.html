        </div>
      </a>
      
      <a href="{{ '/' | relative_url }}" class="category-item">
        <span class="category-emoji">💻</span>
        <div class="category-info">
          <span class="category-name" data-i18n="categories.aiCode">AI Coding</span>

        </div>

      <a href="{{ '/' | relative_url }}" class="category-item">
        <span class="category-emoji">🔊</span>
        <div class="category-info">
          <span class="category-name" data-i18n="categories.aiAudio">AI Audio</span>
          <span class="category-desc" data-i18n="categories.aiAudioDesc">Sound effects, music, voice synthesis</span>
        </div>
      </a>
      
      <a href="{{ '/' | relative_url }}" class="category-item">
        <span class="category-emoji">🎬</span>
        <div class="category-info">
          <span class="category-name" data-i18n="categories.aiAnim">AI Animation</span>
          <span class="category-desc" data-i18n="categories.aiAnimDesc">Motion generation, facial animation</span>

      <a href="{{ '/' | relative_url }}" class="back-link" data-i18n="common.backHome">← Back to Home</a>
    </div>
  </div>
</section>

<script>
// Page-specific i18n for categories page
(function() {
  const pageI18n = {
    en: {
      'categories.title': '🏷️ Categories',
      'categories.aiArt': 'AI Art Tools',
      'categories.aiArtDesc': 'Image generation, textures, materials',
      'categories.aiCode': 'AI Coding',
      'categories.aiCodeDesc': 'Code assistants, shaders, scripting',
      'categories.aiAudio': 'AI Audio',
      'categories.aiAudioDesc': 'Sound effects, music, voice synthesis',
      'categories.aiAnim': 'AI Animation',
      'categories.aiAnimDesc': 'Motion generation, facial animation',
      'common.backHome': '← Back to Home'
    },
    zh: {
      'categories.title': '🏷️ 文章分类',
      'categories.aiArt': 'AI 美术工具',
      'categories.aiArtDesc': '图像生成、纹理、材质',
      'categories.aiCode': 'AI 编程',
      'categories.aiCodeDesc': '代码助手、着色器、脚本',
      'categories.aiAudio': 'AI 音频',
      'categories.aiAudioDesc': '音效、音乐、语音合成',
      'categories.aiAnim': 'AI 动画',
      'categories.aiAnimDesc': '动作生成、面部动画',
      'common.backHome': '← 返回首页'
    }
  };

  // Register page-specific language handler
  window.onLanguageChange = function(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (pageI18n[lang] && pageI18n[lang][key]) {
        el.textContent = pageI18n[lang][key];
      }
    });
  };
})();
</script>

<style>
.categories-page {

}

}

.category-list {
  display: flex;

  gap: 0.75rem;
}

.category-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.25rem;
  background: var(--slate-800);
  border: 1px solid var(--slate-700);
  border-radius: 0.5rem;
  transition: all 0.2s ease;
}

.category-item:hover {
  background: var(--slate-700);
  border-color: var(--emerald-500);
  transform: translateX(4px);
}

.category-emoji {
  font-size: 2rem;
  width: 48px;
  text-align: center;
}

.category-info {
  display: flex;
  flex-direction: column;
}

.category-name {
  color: var(--slate-100);
  font-weight: 600;
  font-size: 1.1rem;
}

.category-desc {
  color: var(--slate-400);
  font-size: 0.875rem;
  margin-top: 0.25rem;
}

.back-link-container {
  margin-top: 2rem;
}

.back-link {
  color: var(--emerald-400);
  font-weight: 500;

}

}
</style>
